<svg width="820" height="220" viewBox="0 0 820 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>MusFy</title>
  <desc>Desktop player with Windows release and Android APK via GitHub Releases - Electron - React - Node - Android</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="820" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00FFC6" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#00FFC6" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <rect x="1" y="1" width="818" height="218" rx="26" fill="url(#bg)" stroke="#17303A" stroke-width="2"/>
  <circle cx="700" cy="64" r="64" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="744" cy="156" r="42" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="644" cy="162" r="28" fill="url(#glow)" filter="url(#blur)"/>

  <rect x="34" y="30" width="156" height="28" rx="14" fill="#0E1724" stroke="#1A2D38"/>
  <text x="52" y="49" fill="#00FFC6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">PROJETO PRINCIPAL</text>

  <text x="34" y="98" fill="#F5F7FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800">MusFy</text>
  <text x="34" y="132" fill="#AAB7C4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Player desktop com release Windows e APK Android no GitHub</text>

  <rect x="34" y="160" width="304" height="34" rx="17" fill="#0E1724" stroke="#1A2D38"/>
  <text x="52" y="182" fill="#D7E0E8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Stack: Electron - React - Node - Android</text>

  <rect x="532" y="34" width="244" height="34" rx="17" fill="#0E1724" stroke="#1A2D38"/>
  <text x="554" y="56" fill="#D7E0E8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">github.com/hasbuen/MusFy</text>

  <rect x="474" y="108" width="302" height="74" rx="20" fill="#0E1724" stroke="#21414B"/>
  <text x="500" y="138" fill="#00FFC6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.3">DESKTOP + MOBILE</text>
  <text x="500" y="160" fill="#F5F7FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">Abrir repositorio</text>
  <text x="500" y="178" fill="#93A4B3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">QR para APK, release no GitHub e app Windows</text>
</svg>
